<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umoja wa Vijana Masuguru</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#087b45;--yellow:#f4c430;--blue:#087eaa}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7f5;color:#18332a}
header{background:var(--green);color:white;padding:24px 16px;text-align:center;border-bottom:6px solid var(--yellow)}
main{max-width:1000px;margin:22px auto;padding:0 14px}.card{background:white;padding:18px;border-radius:12px;margin:14px 0;box-shadow:0 2px 12px #00000010}
h2{color:var(--green);margin-top:0}input,select,button{font:inherit;padding:11px;border:1px solid #ccd8d2;border-radius:7px;margin:5px 0}
input,select{width:100%;max-width:520px}button{background:var(--green);color:white;border:0;cursor:pointer;padding:10px 15px}
button:disabled{opacity:.5;cursor:not-allowed}.reject{background:#a52d2d}.muted{color:#60756b}.hidden{display:none}
table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2eae5}th{background:#edf5f0}
.tablewrap{overflow-x:auto}.status{font-weight:bold}.pending{color:#a36a00}.approved{color:var(--green)}.rejected{color:#a52d2d}
#message{padding:10px;border-radius:7px;margin-top:8px}.ok{background:#e4f5e9;color:#145c32}.err{background:#ffeded;color:#8b2020}
</style></head>
<body>
<header><h1>UMOJA WA VIJANA MASUGURU</h1><p>Umoja • Maendeleo • Uwajibikaji</p></header>
<main>
<section class="card">
<h2>Fomu ya kujiunga na umoja</h2>
<form id="memberForm">
<input name="full_name" placeholder="Jina kamili" required>
<select name="gender" required><option value="">Chagua jinsia</option><option>Mwanaume</option><option>Mwanamke</option></select>
<input name="age" type="number" min="15" placeholder="Umri" required>
<input name="phone" placeholder="Namba ya simu" required>
<input name="village" placeholder="Kijiji/Mtaa" required>
<input name="ward" placeholder="Kata" required>
<input name="occupation" placeholder="Kazi/Shughuli unayofanya">
<button type="submit">Tuma maombi</button>
</form><div id="publicMessage"></div>
</section>
<section class="card">
<h2>Sehemu ya msimamizi (Admin)</h2>
<div id="loginBox">
<input id="email" type="email" placeholder="Barua pepe ya admin">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Ingia</button>
</div>
<div id="adminBox" class="hidden">
<p id="adminInfo" class="muted">Umeingia kama admin.</p>
<button id="refreshBtn">Onyesha upya maombi</button> <button id="logoutBtn" class="reject">Toka</button>
<div id="adminMessage"></div>
<div class="tablewrap"><table><thead><tr><th>Jina</th><th>Simu</th><th>Kijiji/Mtaa</th><th>Kata</th><th>Umri</th><th>Hali</th><th>Hatua</th></tr></thead><tbody id="membersRows"></tbody></table></div>
</div>
</section>
</main>
<script>
const SUPABASE_URL = "https://ewujcsafvhxvrsmnylik.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_UPrXut7Q4VB9sqoM9s1RtQ_GIzs4gn_";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
function show(id,msg,kind="ok"){const el=$(id);el.textContent=msg;el.className=kind;}
$("memberForm").addEventListener("submit",async e=>{
 e.preventDefault();const f=new FormData(e.target);const row=Object.fromEntries(f.entries());
 row.age=Number(row.age);row.status="pending";
 const {error}=await db.from("members").insert(row);
 if(error){show("publicMessage","Imeshindikana kutuma: "+error.message,"err");return;}
 show("publicMessage","Maombi yako yamepokelewa. Yanasubiri kuhakikiwa na uongozi.");e.target.reset();
});
async function checkAdmin(){
 const {data:{user}}=await db.auth.getUser();
 if(!user){$("loginBox").classList.remove("hidden");$("adminBox").classList.add("hidden");return false;}
 const {data,error}=await db.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
 if(error||!data){show("adminMessage","Akaunti hii haina ruhusa ya admin.","err");await db.auth.signOut();return false;}
 $("loginBox").classList.add("hidden");$("adminBox").classList.remove("hidden");await loadMembers();return true;
}
$("loginBtn").onclick=async()=>{
 const {error}=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});
 if(error){show("adminMessage","Imeshindikana kuingia: "+error.message,"err");return;}
 await checkAdmin();
};
async function loadMembers(){
 $("membersRows").innerHTML="<tr><td colspan='7'>Inapakia...</td></tr>";
 const {data,error}=await db.from("members").select("*").order("created_at",{ascending:false});
 if(error){$("membersRows").innerHTML="";show("adminMessage","Imeshindikana kusoma maombi: "+error.message,"err");return;}
 $("membersRows").innerHTML="";
 if(!data?.length){$("membersRows").innerHTML="<tr><td colspan='7'>Hakuna maombi kwa sasa.</td></tr>";return;}
 data.forEach(m=>{
  const tr=document.createElement("tr");
  const status=(m.status||"pending").toLowerCase();
  const cell=(v)=>{const td=document.createElement("td");td.textContent=v??"-";return td;};
  tr.append(cell(m.full_name),cell(m.phone),cell(m.village),cell(m.ward),cell(m.age));
  const st=cell(status);st.className="status "+status;tr.append(st);
  const actions=document.createElement("td");
  if(status==="pending"){
   const yes=document.createElement("button");yes.textContent="Approve";yes.onclick=()=>setStatus(m.id,"approved");
   const no=document.createElement("button");no.textContent="Reject";no.className="reject";no.onclick=()=>setStatus(m.id,"rejected");
   actions.append(yes,no);
  } else {actions.textContent="Hakuna hatua";}
  tr.append(actions);$("membersRows").append(tr);
 });
}
async function setStatus(id,status){
 const {error}=await db.from("members").update({status}).eq("id",id);
 if(error){show("adminMessage","Imeshindikana kubadili hali: "+error.message,"err");return;}
 show("adminMessage",status==="approved"?"Mwanachama amekubaliwa.":"Maombi yamekataliwa.");await loadMembers();
}
$("refreshBtn").onclick=loadMembers;
$("logoutBtn").onclick=async()=>{await db.auth.signOut();await checkAdmin();};
db.auth.onAuthStateChange(()=>{checkAdmin();});
checkAdmin();
</script></body></html>
